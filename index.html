 }
 $("sound").textContent=sound?T.soundOn:T.soundOff;
 show("welcomeScreen");
}

function startQuiz(){
 player=$("playerName").value.trim();
 if(!player){
  $("playerName").focus();
  $("playerName").placeholder=T.name+"!";
  return;
 }
 index=0;score=0;
 $("playerLabel").textContent="💗 "+player;
 show("quizScreen");
 renderQuestion();
}

function renderQuestion(){
 answered=false;
 const list=questions[lang]||questions.en;
 const q=list[index];
 $("counter").textContent=(index+1)+" / "+list.length;
 $("bar").style.width=(index/list.length*100)+"%";
 $("question").textContent=q[0];
 $("feedback").textContent="";
 $("nextBtn").disabled=true;
 $("nextBtn").textContent=index===list.length-1?T.finish:T.next;
 $("options").innerHTML="";

 q[1].forEach((answer,i)=>{
  const btn=document.createElement("button");
  btn.className="option";
  const emoji=document.createElement("span");
  emoji.className="emoji";
  emoji.textContent=emojis[i];
  const label=document.createElement("span");
  label.textContent=answer;
  btn.append(emoji,label);
  btn.onclick=()=>selectAnswer(i,btn);
  $("options").appendChild(btn);
 });
}

function selectAnswer(choice,btn){
 if(answered)return;
 answered=true;
 const list=questions[lang]||questions.en;
 const correct=correctAnswers[index];
 [...$("options").querySelectorAll("button")].forEach(b=>b.disabled=true);
 btn.classList.add("selected");

 if(choice===correct){
  score++;
  $("feedback").textContent=T.correct;
  playTone(660);
 }else{
  $("feedback").textContent=T.wrong+" "+list[index][1][correct];
  playTone(240);
 }
 $("nextBtn").disabled=false;
}

function nextQuestion(){
 if(!answered)return;
 index++;
 const list=questions[lang]||questions.en;
 if(index<list.length)renderQuestion();
 else showResults();
}

function showResults(){
 show("resultScreen");
 $("bar").style.width="100%";
 const list=questions[lang]||questions.en;
 $("resultTitle").textContent=T.result;
 $("resultText").textContent=T.score+" "+score+" "+T.outof+" "+list.length;
 $("score").textContent=score+" / "+list.length+" 💗";
 $("resultMessage").textContent=
  score>=8?T.excellent:score>=5?T.good:T.low;
 $("shareBtn").textContent=T.share;
 $("restartBtn").textContent=T.restart;
}

function toggleSound(){
 sound=!sound;
 $("sound").textContent=sound?T.soundOn:T.soundOff;
}

function playTone(freq){
 if(!sound)return;
 try{
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.frequency.value=freq;
  gain.gain.value=.06;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime+.12);
  osc.onended=()=>ctx.close();
 }catch(e){}
}

function shareResult(){
 const list=questions[lang]||questions.en;
 const message=player+" scored "+score+"/"+list.length+
  " in Who Knows Amulya Best? 💗✨";
 if(navigator.share){
  navigator.share({title:"Who Knows Amulya Best?",text:message}).catch(()=>{});
 }else if(navigator.clipboard){
  navigator.clipboard.writeText(message)
   .then(()=>alert("Result copied! 💗"))
   .catch(()=>prompt("Copy your result:",message));
 }else{
  prompt("Copy your result:",message);
 }
}

function restartQuiz(){
 $("playerName").value="";
 show("languageScreen");
}
</script>

</html>
