}

 uiIds.forEach((id,i)=>{
  if(!id) return;
  const el=document.getElementById(id);
  if(id==="playerName") el.placeholder=u[i];
  else el.textContent=u[i];
 });

 document.getElementById("questionCount").textContent=`${txt(9)} ${index+1} ${txt(10)} 10`;

 });

 if(soundOn){playTone(true);}
}
function playTone(correctAnswer){
 if(!soundOn)return;
 try{
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.frequency.value=correctAnswer?660:260;
  gain.gain.value=.06;osc.start();osc.stop(audioCtx.currentTime+.12);
 }catch(e){}
}

 s.style.fontSize=(8+Math.random()*15)+"px";s.style.animationDelay=Math.random()*2+"s";
